# odoo20-stack — Odoo 20 (Community) + PostgreSQL 17, Kong in front, Dagu backups.
# Every port binds 127.0.0.1; reach it over the tailnet with `tailscale serve` (see README).
name: odoo20

services:
  db:
    image: postgres:17
    container_name: o20-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ${DATA_ROOT}/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:20.0
    container_name: o20-odoo
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${PG_PASSWORD}
    volumes:
      - ${DATA_ROOT}/filestore:/var/lib/odoo
      - ./addons:/mnt/extra-addons:ro
      - ./odoo/odoo.local.conf:/etc/odoo/odoo.conf:ro   # generated by setup.sh (holds admin_passwd), gitignored
    ports:
      - "127.0.0.1:${ODOO_PORT:-8069}:8069"

  kong:
    image: kong:3.9
    container_name: o20-kong
    restart: unless-stopped
    depends_on: [odoo]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "127.0.0.1:${KONG_PORT:-8100}:8000"
      - "127.0.0.1:${KONG_ADMIN_PORT:-8101}:8001"

  dagu:
    build: ./dagu
    container_name: o20-dagu
    restart: unless-stopped
    depends_on: [db]
    environment:
      DAGU_TZ: Asia/Bangkok
      TZ: Asia/Bangkok
      DAGU_DAGS_DIR: /app/dagu
      DAGU_COORDINATOR_ENABLED: "false"
      DAGU_AUTH_MODE: builtin
      DAGU_AUTH_BUILTIN_INITIAL_ADMIN_USERNAME: admin
      DAGU_AUTH_BUILTIN_INITIAL_ADMIN_PASSWORD: ${DAGU_ADMIN_PASSWORD}
      DAGU_AUTH_BUILTIN_TOKEN_SECRET: ${DAGU_TOKEN_SECRET}
      DAGU_PUBLIC_URL: ${DAGU_PUBLIC_URL:-http://127.0.0.1:8092}
      # root inside this container (the entrypoint runs `usermod -o -u $PUID dagu`). Odoo writes its filestore
      # dirs 0700 as uid 100, so a non-root tar cannot read them, and `docker exec` (a manual backup) runs as
      # root anyway. With uid 1000 the root-owned data/proc made the scheduler skip 01:00 on 2026-11-13.
      PUID: "0"
      PGID: "0"
      DOCKER_GID: "-1"
      PGHOST: db
      PGUSER: odoo
      PGPASSWORD: ${PG_PASSWORD}
      ODOO_DB: ${ODOO_DB:-odoo}
    volumes:
      - ./dagu:/app/dagu          # rw: Dagu creates its wiki dir next to the DAGs
      - ${DATA_ROOT}/dagu:/var/lib/dagu
      - ${DATA_ROOT}/filestore:/filestore:ro
      - ${DATA_ROOT}/snapshots:/snapshots
    ports:
      - "127.0.0.1:${DAGU_PORT:-8092}:8080"
